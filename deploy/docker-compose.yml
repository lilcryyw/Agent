# Запуск на VPS:  cp ../.env.example ../.env && nano ../.env && docker compose up -d --build
services:
  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      JARVIS_DB: /app/data/jarvis.db
      JARVIS_WORKSHOP_URL: http://workshop:8700
    volumes:
      - ../data:/app/data            # память, навыки, сейф, кэш модели смыслов (бэкапить эту папку!)
    depends_on: [workshop]
    restart: unless-stopped

  # Мастерская: здесь Джарвис выполняет свой код. Отдельный контейнер — без базы памяти, сейфа и ключа API.
  workshop:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "jarvis.workshop.server"]
    environment:
      JARVIS_WORKSHOP_TOKEN: ${JARVIS_WORKSHOP_TOKEN}
      WORKSHOP_ROOT: /data/workshop
      WORKSHOP_SKILLS: /data/skills
    volumes:
      - ../data/workshop:/data/workshop
      - ../data/skills:/data/skills:ro
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped
