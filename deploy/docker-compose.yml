# Запуск на VPS:  cd deploy && cp ../.env.example ../.env && nano ../.env && docker compose up -d --build
services:
  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      JARVIS_DB: /app/data/jarvis.db
    volumes:
      - ../data:/app/data          # база памяти + кэш модели эмбеддингов (бэкапить эту папку!)
    restart: unless-stopped
