[project]
name = "jarvis"
version = "0.1.0"
description = "Джарвис — семейный ИИ-ассистент с когнитивной памятью человека"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "numpy>=1.26",
    "pydantic>=2.6",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
# Локальная модель эмбеддингов (не языковая модель — только «отпечаток смысла» текста).
embeddings = ["fastembed>=0.4"]
telegram = ["aiogram>=3.4"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.channels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogmem*", "jarvis*", "evals*"]

[tool.setuptools.package-data]
cogmem = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
