<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>J.A.R.V.I.S.</title>
<script src="config.js"></script>
<style>
  :root { --bg:#020812; --cyan:#29e6ff; --cyan2:#7df3ff; --gold:#ffb547; --red:#ff4d6d; --text:#e6f7ff;
          --muted:#7fa3b8; --glass:rgba(12,34,56,.48); --line:rgba(41,230,255,.22); --me:rgba(41,230,255,.16); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; font:16px/1.45 Inter, -apple-system, system-ui, sans-serif; color:var(--text); background:var(--bg);
         background-image:radial-gradient(circle at 50% -10%, rgba(41,230,255,.18), transparent 55%),
           linear-gradient(rgba(41,230,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(41,230,255,.05) 1px, transparent 1px);
         background-size:100% 100%, 32px 32px, 32px 32px; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  header { padding:calc(12px + env(safe-area-inset-top)) 18px 10px; display:flex; justify-content:space-between; align-items:center; }
  .brand { font:700 18px Orbitron, sans-serif; letter-spacing:.28em; color:var(--cyan); text-shadow:0 0 14px rgba(41,230,255,.6); }
  .brand small { display:block; font:500 9px Inter; letter-spacing:.18em; color:var(--muted); text-shadow:none; margin-top:2px; }
  label.tg { color:var(--muted); font-size:12px; display:flex; gap:6px; align-items:center; }
  #log { flex:1; overflow-y:auto; padding:6px 16px 10px; display:flex; flex-direction:column; gap:10px; width:100%; max-width:820px; margin:0 auto; }
  .m { max-width:86%; padding:11px 14px; border-radius:18px 18px 18px 6px; background:var(--glass); border:1px solid var(--line);
       backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); white-space:pre-wrap; overflow-wrap:anywhere;
       box-shadow:0 0 24px rgba(41,230,255,.06) inset; animation:in .25s ease-out; }
  .me { align-self:flex-end; background:var(--me); border-radius:18px 18px 6px 18px; }
  .sys { align-self:center; color:var(--muted); background:none; border:none; font-size:13px; text-align:center; box-shadow:none; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  a.btn { display:inline-block; margin:6px 0 2px; padding:9px 14px; border-radius:12px; background:var(--cyan); color:#001018;
          text-decoration:none; font-weight:600; font-size:14px; }
  #hero { display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0 4px; }
  #hero p { margin:0; color:var(--muted); font-size:13px; letter-spacing:.04em; }
  footer { padding:10px 14px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; width:100%; max-width:820px; margin:0 auto; }
  #text { flex:1; min-width:0; padding:14px 16px; border-radius:16px; border:1px solid var(--line); background:var(--glass);
          backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:var(--text); font:16px Inter; outline:none; }
  #text:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(41,230,255,.15); }
  .round { width:54px; height:54px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--glass);
           color:var(--cyan); font-size:22px; display:grid; place-items:center; cursor:pointer; backdrop-filter:blur(14px); }
  /* Арк-реактор */
  .reactor { position:relative; width:var(--sz,120px); aspect-ratio:1; display:grid; place-items:center; cursor:pointer; }
  .reactor svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .reactor .r1 { animation:spin 14s linear infinite; transform-origin:50% 50%; }
  .reactor .r2 { animation:spin 9s linear infinite reverse; transform-origin:50% 50%; }
  .reactor .r3 { animation:spin 22s linear infinite; transform-origin:50% 50%; }
  .reactor .core { width:34%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle, #fff 0 18%, var(--cyan2) 35%, var(--cyan) 60%, rgba(41,230,255,0) 72%);
                   box-shadow:0 0 40px 10px rgba(41,230,255,.55), 0 0 90px 30px rgba(41,230,255,.18); transition:background .4s, box-shadow .4s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #setup { padding:22px 18px; display:none; max-width:520px; margin:0 auto; }
  #setup input { width:100%; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--glass); color:var(--text); margin:8px 0; font-size:16px; }
  #setup button { padding:12px 20px; border-radius:12px; border:none; background:var(--cyan); color:#001018; font-weight:600; font-size:16px; }
  /* HUD голосового режима */
  #call { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:space-between;
          padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
          background:radial-gradient(circle at 50% 42%, rgba(41,230,255,.16), rgba(2,8,18,.97) 58%), var(--bg); }
  #call.on { display:flex; }
  #status { font:600 13px Orbitron, sans-serif; letter-spacing:.26em; text-transform:uppercase; color:var(--cyan); text-shadow:0 0 12px rgba(41,230,255,.7); text-align:center; }
  #modeName { margin-top:6px; font-size:12px; color:var(--muted); text-align:center; letter-spacing:.06em; }
  #orbWrap { flex:1; display:grid; place-items:center; width:100%; }
  #orb { --sz:min(64vw, 300px); transition:transform .08s linear; }
  #call[data-s="thinking"] .core { background:radial-gradient(circle, #fff 0 15%, #ffe2a8 35%, var(--gold) 60%, rgba(255,181,71,0) 72%);
                                   box-shadow:0 0 40px 10px rgba(255,181,71,.5), 0 0 90px 30px rgba(255,181,71,.15); }
  #call[data-s="thinking"] .r2 { animation-duration:2.2s; }
  #call[data-s="speaking"] .core { box-shadow:0 0 60px 18px rgba(125,243,255,.8), 0 0 140px 50px rgba(41,230,255,.25); }
  #call[data-s="connecting"] .reactor, #call.muted .reactor { filter:grayscale(.85) brightness(.6); }
  #feed { width:100%; max-width:560px; min-height:96px; max-height:30vh; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:4px;
          font-size:15px; mask-image:linear-gradient(transparent, #000 35%); -webkit-mask-image:linear-gradient(transparent, #000 35%); }
  #feed .l { color:var(--muted); } #feed .l b { color:var(--cyan); font-weight:600; margin-right:6px; }
  #feed .l.j { color:var(--text); } #feed .l.j b { color:var(--gold); }
  #caption { display:none; }
  #controls { display:flex; gap:28px; margin-top:14px; }
  #muteBtn.on { background:var(--text); color:#001018; }
  #endBtn { color:var(--red); border-color:rgba(255,77,109,.45); }
  #modeBtn { font-size:20px; }
  #hint { color:#5d7f93; font-size:12px; margin-top:10px; text-align:center; }
  @media (min-width: 900px) { #orb { --sz:340px; } #feed { max-height:34vh; } }
</style>
</head>
<body>
<header>
  <div class="brand">J.A.R.V.I.S.<small>JUST A RATHER VERY INTELLIGENT SYSTEM</small></div>
  <label class="tg"><input type="checkbox" id="voiceOn" checked> 🔊</label>
</header>
<div id="setup">
  <p>Вставь ключ доступа (его выдаёт Джарвис или установщик сервера).</p>
  <input id="tok" placeholder="jv_…" autocomplete="off">
  <button id="save">Подключить</button>
</div>
<div id="hero">
  <div class="reactor" id="callBtn" style="--sz:118px" aria-label="Голосовой режим">
    <svg viewBox="0 0 100 100"><circle class="r3" cx="50" cy="50" r="48" fill="none" stroke="rgba(41,230,255,.25)" stroke-width=".6" stroke-dasharray="2 3"/>
      <circle class="r1" cx="50" cy="50" r="41" fill="none" stroke="rgba(41,230,255,.7)" stroke-width="1.4" stroke-dasharray="18 6 4 6"/>
      <circle class="r2" cx="50" cy="50" r="33" fill="none" stroke="rgba(125,243,255,.55)" stroke-width="2.2" stroke-dasharray="10 14"/></svg>
    <div class="core"></div>
  </div>
  <p>Коснись реактора — голосовой режим</p>
</div>
<div id="log"></div>
<footer>
  <input id="text" placeholder="Сообщение Джарвису…" enterkeyhint="send">
</footer>

<div id="call" data-s="connecting">
  <div><div id="status">Соединяю…</div><div id="modeName"></div></div>
  <div id="orbWrap"><div class="reactor" id="orb" title="Коснись, чтобы перебить">
    <svg viewBox="0 0 100 100"><circle class="r3" cx="50" cy="50" r="49" fill="none" stroke="rgba(41,230,255,.22)" stroke-width=".5" stroke-dasharray="1 2"/>
      <circle class="r1" cx="50" cy="50" r="43" fill="none" stroke="rgba(41,230,255,.75)" stroke-width="1.2" stroke-dasharray="22 5 3 5"/>
      <circle class="r2" cx="50" cy="50" r="35" fill="none" stroke="rgba(125,243,255,.6)" stroke-width="2.4" stroke-dasharray="9 12"/>
      <circle class="r3" cx="50" cy="50" r="27" fill="none" stroke="rgba(41,230,255,.35)" stroke-width=".8" stroke-dasharray="40 8"/></svg>
    <div class="core"></div>
  </div></div>
  <div id="feed"></div><div id="caption"></div>
  <div id="controls">
    <button id="muteBtn" class="round" aria-label="Микрофон">🎙</button>
    <button id="modeBtn" class="round" aria-label="Сменить режим">👂</button>
    <button id="endBtn" class="round" aria-label="Выйти">✕</button>
  </div>
  <div id="hint"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
// Ключ можно передать ссылкой: /app/#t=jv_… (часть после # не уходит на сервер и в логи).
const tm = location.hash.match(/t=([\w-]+)/);
if (tm) { store.set("token", tm[1]); history.replaceState(null, "", location.pathname); }
let token = store.get("token");
const voiceOn = $("voiceOn");
voiceOn.checked = store.get("voiceOn") !== "0";
voiceOn.onchange = () => store.set("voiceOn", voiceOn.checked ? "1" : "0");
const BASE = (window.JARVIS_API_BASE || "").replace(/\/$/, "");

// Кнопки Команд iPhone: в тексте ответа [[ярлык:Имя|Надпись|вход]] превращается в кнопку shortcuts://
const MARK = /\[\[ярлык:([^|\]]+)\|([^|\]]+)(?:\|([^\]]*))?\]\]/g;
function fill(d, text) {
  let last = 0, m;
  MARK.lastIndex = 0;
  while ((m = MARK.exec(text)) !== null) {
    d.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement("a");
    a.className = "btn";
    a.textContent = m[2];
    let href = "shortcuts://run-shortcut?name=" + encodeURIComponent(m[1]);
    if (m[3]) href += "&input=text&text=" + encodeURIComponent(m[3]);
    a.href = href;
    d.appendChild(a);
    last = MARK.lastIndex;
  }
  d.appendChild(document.createTextNode(text.slice(last)));
}
function add(text, cls) {
  const d = document.createElement("div");
  d.className = "m " + (cls || "");
  fill(d, text);
  $("log").appendChild(d);
  d.scrollIntoView({ behavior: "smooth" });
  return d;
}
function needToken() { $("setup").style.display = "block"; }
$("save").onclick = () => { token = $("tok").value.trim(); store.set("token", token); $("setup").style.display = "none"; add("Ключ сохранён. Нажми 📞 и говори!", "sys"); };
if (!token) needToken();

async function api(path, body, type) {
  const r = await fetch(BASE + "/api/" + path, { method: "POST", body,
    headers: { "Authorization": "Bearer " + token, "X-Device": "web", ...(type ? { "Content-Type": type } : {}) } });
  if (r.status === 401) { needToken(); throw new Error("нужен ключ"); }
  if (!r.ok) throw new Error("сервер ответил " + r.status);
  return r;
}
const player = new Audio();
async function say(text) {
  if (!voiceOn.checked || call.on) return;
  try {  // голос Джарвиса с сервера; не вышло — голос телефона
    const r = await api("speak", JSON.stringify({ text }), "application/json");
    player.src = URL.createObjectURL(await r.blob());
    await player.play();
  } catch { speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(text), { lang: "ru-RU" })); }
}
async function ask(text) {
  add(text, "me");
  const wait = add("…");
  try {
    const r = await (await api("ask", JSON.stringify({ text }), "application/json")).json();
    if (!r.reply) { wait.remove(); return; }  // Джарвис решил промолчать
    wait.textContent = ""; fill(wait, r.reply); say(r.reply);
  } catch (e) { wait.textContent = "Нет связи: " + e.message; }
}
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.value.trim()) { ask(e.target.value.trim()); e.target.value = ""; } });

// ───────────────────────── Живой разговор ─────────────────────────
// Микрофон работает непрерывно: звук 16 кГц уходит на сервер, тот сам слышит конец фразы,
// отвечает голосом по предложениям и замолкает, если его перебили.
const WORKLET = `
class Mic extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.acc = 0; this.sum = 0; this.n = 0;
                  this.buf = new Int16Array(1024); this.len = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.sum += ch[i]; this.n++; this.acc += 1;
      if (this.acc >= this.ratio) {           // усреднение = простой фильтр + понижение частоты
        this.acc -= this.ratio;
        const v = Math.max(-1, Math.min(1, this.sum / this.n)); this.sum = 0; this.n = 0;
        this.buf[this.len++] = v * 32767;
        if (this.len === this.buf.length) { this.port.postMessage(this.buf.buffer.slice(0)); this.len = 0; }
      }
    }
    return true;
  }
}
registerProcessor("mic", Mic);`;

const call = { on: false, ws: null, ctx: null, stream: null, node: null, out: null, analyser: null,
               muted: false, state: "connecting", level: 0, retries: 0, wake: null,
               nextAt: 0, sources: [], playing: 0, done: 0, cancelled: new Set(), chain: Promise.resolve(),
               heard: "", reply: "", speaking: 0 };
let mode = store.get("mode") || "ambient";  // ambient — слышу всё вокруг; call — разговор с Джарвисом
const STATUS = { connecting: "Соединяю…", listening: "Слушаю", thinking: "Анализирую…", speaking: "Говорю" };
const MODES = { ambient: ["👂", "Слышу всё вокруг · подскажу, когда нужно · «Джарвис, …» — обратиться"],
                call: ["💬", "Разговор · просто говори, можно перебить"] };
function showMode() { $("modeBtn").textContent = mode === "ambient" ? "💬" : "👂"; $("modeName").textContent = MODES[mode][1];
  $("hint").textContent = mode === "ambient" ? "Наушник в ухо — и занимайся своими делами. Дословное помню 30 минут, тему — навсегда."
                                             : "Коснись реактора, чтобы перебить."; }
function feed(who, text, j) {
  const f = $("feed"), d = document.createElement("div");
  d.className = "l" + (j ? " j" : ""); const b = document.createElement("b"); b.textContent = who; d.appendChild(b);
  d.appendChild(document.createTextNode(text)); f.appendChild(d);
  while (f.children.length > 8) f.removeChild(f.firstChild);
}

function setState(s) {
  call.state = s;
  $("call").dataset.s = s;
  $("status").textContent = call.muted && s === "listening" ? "Микрофон выключен" : (s === "listening" && mode === "ambient" ? "Слышу всё" : STATUS[s] || s);
}
function caption() {
  const c = $("caption"); c.textContent = "";
  if (call.heard) { const y = document.createElement("div"); y.className = "you"; y.textContent = call.heard; c.appendChild(y); }
  const r = document.createElement("div"); r.textContent = call.reply; c.appendChild(r);
}

function wsUrl() {
  if (window.JARVIS_CALL_URL) return window.JARVIS_CALL_URL;
  const base = BASE || location.origin;
  return base.replace(/^http/, "ws") + "/call";
}

async function startCall() {
  if (!token) { needToken(); return; }
  if (call.on) return;
  call.on = true; call.retries = 0; call.heard = ""; call.reply = ""; caption(); $("feed").textContent = ""; showMode();
  $("call").classList.add("on"); setState("connecting");
  try {
    // Эхоподавление: браузер вычитает голос Джарвиса из микрофона — можно говорить без наушников.
    call.stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (e) { endCall("Нет доступа к микрофону: " + e.message); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = "play-and-record"; } catch {}
  try { speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(" "), { volume: 0 })); } catch {}
  call.ctx = new (window.AudioContext || window.webkitAudioContext)();
  await call.ctx.resume();
  call.out = call.ctx.createGain(); call.analyser = call.ctx.createAnalyser(); call.analyser.fftSize = 512;
  call.out.connect(call.analyser); call.analyser.connect(call.ctx.destination);
  const src = call.ctx.createMediaStreamSource(call.stream);
  try {
    const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
    await call.ctx.audioWorklet.addModule(url);
    call.node = new AudioWorkletNode(call.ctx, "mic");
    call.node.port.onmessage = (e) => onMic(e.data);
  } catch {  // старые браузеры: ScriptProcessor
    const sp = call.ctx.createScriptProcessor(4096, 1, 1), ratio = call.ctx.sampleRate / 16000;
    sp.onaudioprocess = (e) => {
      const x = e.inputBuffer.getChannelData(0), n = Math.floor(x.length / ratio), out = new Int16Array(n);
      for (let i = 0; i < n; i++) out[i] = Math.max(-1, Math.min(1, x[Math.floor(i * ratio)])) * 32767;
      onMic(out.buffer);
    };
    call.node = sp;
  }
  src.connect(call.node);
  const sink = call.ctx.createGain(); sink.gain.value = 0; call.node.connect(sink); sink.connect(call.ctx.destination);
  try { call.wake = await navigator.wakeLock?.request("screen"); } catch {}
  connect();
  requestAnimationFrame(animate);
}

function connect() {
  const ws = new WebSocket(wsUrl());
  ws.binaryType = "arraybuffer";
  call.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", token, device: "web", mode }));
  ws.onmessage = (e) => (typeof e.data === "string" ? onMsg(JSON.parse(e.data)) : onAudio(e.data));
  ws.onclose = () => {
    if (!call.on || call.ws !== ws) return;
    stopPlayback();
    if (call.retries++ < 5) { setState("connecting"); $("status").textContent = "Связь прервалась, переподключаюсь…"; setTimeout(connect, 1000 * call.retries); }
    else endCall("Нет связи с Джарвисом.");
  };
}

function onMic(buf) {
  const a = new Int16Array(buf);
  let s = 0; for (let i = 0; i < a.length; i += 4) s += a[i] * a[i];
  call.level = Math.min(1, Math.sqrt(s / (a.length / 4)) / 6000);
  if (call.muted || !call.ws || call.ws.readyState !== 1) return;
  call.ws.send(buf);
}

function onMsg(m) {
  if (m.type === "ready") { call.retries = 0; }
  else if (m.type === "error") { if (/ключ/.test(m.text)) needToken(); endCall(m.text); }
  else if (m.type === "state") setState(m.state);
  else if (m.type === "heard") {
    call.heard = m.text; call.reply = ""; caption();
    feed(m.who === "рядом" ? "РЯДОМ" : m.who === "я" ? "ТЫ" : (m.ambient ? "СЛЫШУ" : "ТЫ"), m.text);
    if (!m.ambient) add(m.text, "me");
  }
  else if (m.type === "say") {
    if (call.cancelled.has(m.turn)) return;
    call.reply = (call.reply + " " + m.text).trim(); caption();
    if (m.turn > 1 || mode === "call") feed("JARVIS", m.text, true);
    if (m.speak) speakLocal(m.turn, m.text);  // сервер без своего голоса — говорит телефон
  }
  else if (m.type === "reply") { if (m.turn > 1 && m.text) add(m.text + (call.cancelled.has(m.turn) ? " (перебит)" : "")); }
  else if (m.type === "done") { call.done = m.turn; call.chain = call.chain.then(checkPlayed); }
  else if (m.type === "interrupt") { call.cancelled.add(m.turn); stopPlayback(); }
}

function onAudio(data) {
  const turn = new DataView(data).getUint32(0);
  const mp3 = data.slice(4);
  call.chain = call.chain.then(async () => {
    if (call.cancelled.has(turn) || !call.ctx) return;
    let buf;
    try { buf = await call.ctx.decodeAudioData(mp3); } catch { return; }
    if (call.cancelled.has(turn)) return;
    const s = call.ctx.createBufferSource(); s.buffer = buf; s.connect(call.out);
    const at = Math.max(call.ctx.currentTime + 0.05, call.nextAt);
    s.start(at); call.nextAt = at + buf.duration;
    call.sources.push(s); call.playing = turn;
    s.onended = () => { call.sources = call.sources.filter((x) => x !== s); checkPlayed(); };
  });
}
// Голос телефона (когда сервер слабый и присылает только текст).
let ruVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  ruVoice = vs.find((v) => /^ru/i.test(v.lang) && /milena|милена|google/i.test(v.name)) || vs.find((v) => /^ru/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speakLocal(turn, text) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text.replace(/https?:\/\/\S+/g, "ссылка на экране"));
  u.lang = "ru-RU"; if (ruVoice) u.voice = ruVoice; u.rate = 1.05;
  call.speaking++; call.playing = turn;
  u.onend = u.onerror = () => { call.speaking = Math.max(0, call.speaking - 1); checkPlayed(); };
  speechSynthesis.speak(u);
}
function checkPlayed() {
  if (call.playing && !call.sources.length && !call.speaking && call.done === call.playing && call.ws?.readyState === 1) {
    call.ws.send(JSON.stringify({ type: "played", turn: call.playing }));
    call.playing = 0;
  }
}
function stopPlayback() {
  for (const s of call.sources) { try { s.onended = null; s.stop(); } catch {} }
  call.sources = []; call.nextAt = 0; call.playing = 0;
  if (call.speaking) { call.speaking = 0; try { speechSynthesis.cancel(); } catch {} }
}

function animate() {
  if (!call.on) return;
  let lvl = call.level;
  if (call.state === "speaking" && call.analyser) {
    const d = new Uint8Array(call.analyser.fftSize); call.analyser.getByteTimeDomainData(d);
    let s = 0; for (const v of d) s += (v - 128) * (v - 128);
    lvl = Math.min(1, Math.sqrt(s / d.length) / 40);
  }
  if (call.state !== "thinking") $("orb").style.transform = `scale(${1 + (call.muted ? 0 : lvl) * 0.35})`;
  else $("orb").style.transform = "";
  requestAnimationFrame(animate);
}

function endCall(reason) {
  if (!call.on) return;
  call.on = false;
  try { call.ws?.close(); } catch {}
  call.ws = null;
  stopPlayback();
  call.stream?.getTracks().forEach((t) => t.stop());
  try { call.ctx?.close(); } catch {}
  call.ctx = null; call.node = null;
  try { call.wake?.release(); } catch {}
  call.cancelled = new Set(); call.chain = Promise.resolve(); call.done = 0;
  $("call").classList.remove("on", "muted");
  call.muted = false; $("muteBtn").classList.remove("on"); $("muteBtn").textContent = "🎙";
  if (reason) add(reason, "sys");
}

$("callBtn").onclick = startCall;
$("modeBtn").onclick = () => {  // сменить режим: переподключиться с новым
  mode = mode === "ambient" ? "call" : "ambient"; store.set("mode", mode); showMode();
  if (call.ws) { const old = call.ws; call.ws = null; try { old.close(); } catch {} connect(); }
};
$("endBtn").onclick = () => endCall();
$("orb").onclick = () => { if (call.ws?.readyState === 1 && (call.state === "speaking" || call.state === "thinking")) call.ws.send(JSON.stringify({ type: "interrupt" })); };
$("muteBtn").onclick = () => {
  call.muted = !call.muted;
  $("muteBtn").classList.toggle("on", call.muted); $("muteBtn").textContent = call.muted ? "🔇" : "🎙";
  $("call").classList.toggle("muted", call.muted);
  if (call.ws?.readyState === 1) call.ws.send(JSON.stringify({ type: "mute", on: call.muted }));
  setState(call.state);
};
document.addEventListener("visibilitychange", async () => {  // вернулся в приложение — разбудить звук
  if (document.visibilityState === "visible" && call.on) {
    try { await call.ctx?.resume(); call.wake = await navigator.wakeLock?.request("screen"); } catch {}
  }
});

// Сообщения по инициативе Джарвиса (напоминания и т.п.).
async function inbox() {
  if (!token) return;
  try {
    const r = await (await api("inbox", "{}", "application/json")).json();
    for (const t of r.messages || []) { add(t); say(t); }
  } catch {}
}
setInterval(inbox, 30000); inbox();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
